<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Study Tool Kindle Import</title>
    <style>
      body {
        margin: 0;
        background: #f7f7f5;
        color: #1f2933;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      section {
        background: #fff;
        border: 1px solid #d8ddd5;
        border-radius: 8px;
        padding: 20px;
        margin-top: 16px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #b8c0b2;
        border-radius: 6px;
        font: inherit;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 10px 14px;
        margin: 8px 8px 0 0;
      }
      button.secondary {
        background: #475569;
      }
      button.danger {
        background: #b91c1c;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .muted {
        color: #52606d;
        margin: 0;
      }
      .status {
        min-height: 22px;
        margin-top: 10px;
      }
      .code {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 6px;
        background: #eef2ff;
        color: #1e3a8a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 20px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="dist/options.js"></script>
  </body>
</html>
