name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main
      - feature/initial-setup
      - feature/firebase-storage
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_API_SERVICE }}
  GAR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  APP_ENV: ${{ vars.APP_ENV || 'production' }}
  STRIPE_PRICE_ID_MONTHLY: ${{ vars.STRIPE_PRICE_ID_MONTHLY || '' }}
  STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL || '' }}
  STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL || '' }}
  QUEUE_QUESTION_GENERATION: ${{ vars.QUEUE_QUESTION_GENERATION || '' }}
  QUEUE_HIGHLIGHT_IMPORT: ${{ vars.QUEUE_HIGHLIGHT_IMPORT || '' }}
  TASK_HANDLER_BASE_URL: ${{ vars.TASK_HANDLER_BASE_URL || '' }}

jobs:
  test-and-deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION SERVICE GAR_REPOSITORY QUEUE_QUESTION_GENERATION QUEUE_HIGHLIGHT_IMPORT TASK_HANDLER_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable: ${name}"
              exit 1
            fi
          done
          if [ -z "${{ vars.CORS_ALLOWED_ORIGINS }}" ]; then
            echo "Missing GitHub Actions variable: CORS_ALLOWED_ORIGINS"
            exit 1
          fi
          if [ -z "${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}" ]; then
            echo "Missing GitHub Actions variable: CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT"
            exit 1
          fi
          if [ -z "${{ vars.GCS_BUCKET_NAME }}" ]; then
            echo "Missing GitHub Actions variable: GCS_BUCKET_NAME"
            exit 1
          fi
          if [ -z "${{ vars.GCS_SIGNING_SERVICE_ACCOUNT }}" ]; then
            echo "Missing GitHub Actions variable: GCS_SIGNING_SERVICE_ACCOUNT"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "Missing GitHub Actions secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}" ]; then
            echo "Missing GitHub Actions secret: GCP_DEPLOYER_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare Cloud Run secret bindings
        id: cloud-run-secrets
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "secrets<<EOF"
            echo "DATABASE_URL=DATABASE_URL:latest"
            echo "GEMINI_API_KEY=GEMINI_API_KEY:latest"
            for secret in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
              if gcloud secrets describe "${secret}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
                echo "${secret}=${secret}:latest"
              else
                echo "Optional GCP Secret Manager secret not found: ${secret}; deploying without it." >&2
              fi
            done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -f backend/Dockerfile -t "${IMAGE}" backend
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Deploy API to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ steps.image.outputs.image }}
          env_vars: |-
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
            GCS_SIGNING_SERVICE_ACCOUNT=${{ vars.GCS_SIGNING_SERVICE_ACCOUNT }}
            APP_ENV=${{ env.APP_ENV }}
            STRIPE_PRICE_ID_MONTHLY=${{ env.STRIPE_PRICE_ID_MONTHLY }}
            STRIPE_SUCCESS_URL=${{ env.STRIPE_SUCCESS_URL }}
            STRIPE_CANCEL_URL=${{ env.STRIPE_CANCEL_URL }}
            QUEUE_QUESTION_GENERATION=${{ env.QUEUE_QUESTION_GENERATION }}
            QUEUE_HIGHLIGHT_IMPORT=${{ env.QUEUE_HIGHLIGHT_IMPORT }}
            TASK_HANDLER_BASE_URL=${{ env.TASK_HANDLER_BASE_URL }}
          secrets: ${{ steps.cloud-run-secrets.outputs.secrets }}
          flags: >-
            --port=8080
            --allow-unauthenticated
            --ingress=internal-and-cloud-load-balancing
            --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --max-instances=10
            --concurrency=80
            --cpu=1
            --memory=512Mi
            --timeout=60s

      - name: Check deployed Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          ready_status="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.conditions[?type="Ready"].status)')"
          if [ "${ready_status}" != "True" ]; then
            echo "Cloud Run service is not Ready: ${ready_status}"
            exit 1
          fi
