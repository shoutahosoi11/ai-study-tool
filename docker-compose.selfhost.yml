# Local self-host/demo compose file. This is not a production deployment
# template: it uses development defaults, a local Postgres password, and
# sslmode=disable for the in-network database connection.
services:
  postgres:
    image: postgres:16
    container_name: ai-study-tool-postgres
    restart: always
    environment:
      POSTGRES_DB: ai_study_tool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_study_tool"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: ai-study-tool-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_study_tool?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: ai-study-tool-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
